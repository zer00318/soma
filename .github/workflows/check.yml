name: check

# The full governance gate (ruff, mypy --strict, complexity/length limits,
# vulture, frozen-gold hash check, pytest + coverage). Mirrors `make check`
# locally and the pre-push hook, so a green gate is enforced on every push
# and pull request to main — even solo.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create venv and install dev dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'

      - name: make check (governance gate)
        run: make check
