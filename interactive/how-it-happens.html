<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOMA — one moment, all the way through</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#06080c;height:100%}
  body{height:1800vh}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    font:11px ui-monospace,Menlo,monospace;letter-spacing:.34em;color:#5b6478;
    z-index:5;transition:opacity .5s}
  #rail{position:fixed;right:0;top:0;bottom:0;width:2px;background:#0f131b;z-index:5}
  #head{position:absolute;left:0;width:2px;background:#e8a33d}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">SCROLL</div>
<div id="rail"><div id="head"></div></div>
<script>
(function(){
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hint=document.getElementById('hint'), head=document.getElementById('head');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const WORLD=16200;
let cam=0,camTarget=0;
const prog=()=>{const m=document.body.scrollHeight-innerHeight;return m>0?scrollY/m:0;};

const INK='#06080c',DIM='#454f60',MUTE='#7b8799',TXT='#dfe6f2',
      FIRE='#e8a33d',GOLD='#ffd08a',EYE='#5cc8ff',EAR='#7ed9a0',
      KILL='#f2685f',NODE='#c58cf5',WARM='#c98a4b';
const R=(a,b)=>a+Math.random()*(b-a), cl=(v,a,b)=>Math.max(a,Math.min(b,v));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function mono(x,y,s,c,sz,al){ctx.fillStyle=c||MUTE;ctx.font=(sz||11)+'px ui-monospace,Menlo,monospace';
  ctx.textAlign=al||'left';ctx.fillText(s,x,y);ctx.textAlign='left';}
function serif(x,y,s,c,sz,al){ctx.fillStyle=c||TXT;
  ctx.font=sz+'px "Iowan Old Style",Palatino,Georgia,serif';ctx.textAlign=al||'left';
  ctx.fillText(s,x,y);ctx.textAlign='left';}
function ln(x1,y1,x2,y2,c,w,d){ctx.strokeStyle=c;ctx.lineWidth=w||1;if(d)ctx.setLineDash(d);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function dot(x,y,r,c,a){ctx.globalAlpha=a===undefined?1:a;ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a===undefined?.5:a;
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function box(x,y,w,h,c,fill){ctx.strokeStyle=c;ctx.lineWidth=1.2;ctx.strokeRect(x,y,w,h);
  if(fill){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);}}

// ══════════ THE SCENE — one kitchen, one moment, drawn again and again ══════
// Everything downstream refers back to exactly this.
function kitchen(ox,oy,s,o){
  o=o||{};
  ctx.save(); ctx.translate(ox,oy); ctx.scale(s,s);
  // window light
  const g=ctx.createLinearGradient(150,-160,420,140);
  g.addColorStop(0,'rgba(255,214,150,.09)');g.addColorStop(1,'rgba(255,214,150,0)');
  ctx.fillStyle=g; ctx.fillRect(120,-170,340,330);
  ctx.strokeStyle='#1b2330';ctx.lineWidth=2;ctx.strokeRect(150,-160,150,120);
  ctx.beginPath();ctx.moveTo(225,-160);ctx.lineTo(225,-40);
  ctx.moveTo(150,-100);ctx.lineTo(300,-100);ctx.stroke();
  // counter
  ctx.fillStyle='#141a25'; ctx.fillRect(-60,60,540,14);
  ctx.fillStyle='#0d121b'; ctx.fillRect(-60,74,540,90);
  // person
  ctx.fillStyle=o.dim?'#10151f':'#161d2a';
  ctx.beginPath();ctx.arc(30,-30,30,0,7);ctx.fill();
  rr(-10,10,80,58,16);ctx.fill();
  // arm reaching to the jar
  ctx.strokeStyle=o.dim?'#10151f':'#161d2a';ctx.lineWidth=17;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(66,26);ctx.lineTo(146,40);ctx.stroke();ctx.lineCap='butt';
  // THE JAR
  ctx.fillStyle='#1d222c'; rr(160,-6,58,66,6); ctx.fill();
  ctx.fillStyle='#2a2f3b'; rr(158,-16,62,16,4); ctx.fill();      // lid
  ctx.fillStyle='rgba(150,96,48,.55)'; rr(164,26,50,32,3); ctx.fill(); // contents ¼
  ctx.fillStyle='rgba(236,229,214,.82)'; rr(163,4,52,20,2); ctx.fill(); // label
  ctx.fillStyle='#20242c';ctx.font='bold 9px Georgia';ctx.fillText('NUTELLA',167,17);
  ctx.fillStyle='#4a4f58';ctx.font='7px Georgia';ctx.fillText('750 g',196,17);
  // mug, board
  ctx.fillStyle='#131924'; rr(300,26,34,34,5); ctx.fill();
  ctx.fillStyle='#151b26'; rr(360,44,86,16,3); ctx.fill();
  // speech
  if(o.speak){
    const p=o.speak;
    for(let i=0;i<3;i++){const q=((p+i/3)%1);
      ctx.strokeStyle='rgba(126,217,160,'+(0.34*(1-q))+')';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(6,-30,16+q*70,2.2,4.1);ctx.stroke();}
  }
  ctx.restore();
}

function spineY(x){return H*0.52+Math.sin(x/1300)*H*0.05;}

// ══ 1 · THE MOMENT ═════════════════════════════════════════════════════════
function actMoment(t){
  const x0=120, yc=spineY(600);
  kitchen(x0+180,yc,1,{speak:(t*0.5)%1});
  mono(x0,yc-250,'09:14:07 · TUESDAY · KITCHEN',FIRE,12);
  serif(x0,yc-212,'A person reaches for a jar and says something.',TXT,27);
  mono(x0,yc-180,'this is the only moment that will ever happen. everything after is about keeping it.',DIM,12);
  const a=cl(((t*0.5)%1)*3,0,1);
  if(a>0.15){ctx.globalAlpha=cl(a*2,0,1);
    serif(x0+560,yc-40,'“we\'re nearly out of',EAR,20);
    serif(x0+560,yc-10,'the hazelnut stuff”',EAR,20);ctx.globalAlpha=1;}
  mono(x0+560,yc+40,'sound, arriving as sound — not yet as words',DIM,11);
}

// ══ 2 · SAMPLING — HOW MUCH TO RECORD, DECIDED CONTINUOUSLY ════════════════
function actSampling(t){
  const x0=1700, yc=spineY(x0+600);
  kitchen(x0-40,yc+30,0.52,{dim:1,speak:(t*0.5)%1});
  mono(x0,yc-260,'THE SENSES DO NOT RECORD EVERYTHING THE SAME WAY',FIRE,12);
  serif(x0,yc-222,'How much to spend on this instant?',TXT,26);
  mono(x0,yc-190,'the dial moves by itself, many times a second',DIM,12);
  // the regimes, chosen by what the scene is doing
  const phase=(t*0.18)%1;
  const regimes=[
    ['STILL','5 fps · 360p','nothing is moving — barely look',0.00],
    ['MOTION','30 fps · 1080p','a hand enters the frame',0.28],
    ['FAST','120 fps · 720p','the reach is quick; freeze it or lose it',0.52],
    ['DWELL','1 frame · 4K','it settled — now spend everything, once',0.76]];
  let cur=0; regimes.forEach((r,i)=>{if(phase>=r[3])cur=i;});
  const bx=x0+330;
  regimes.forEach((r,i)=>{
    const y=yc-130+i*66, on=i===cur;
    ctx.globalAlpha=on?1:0.28;
    box(bx,y,20,20,on?FIRE:DIM, on?'rgba(232,163,61,.22)':null);
    mono(bx+34,y+15,r[0],on?FIRE:DIM,12);
    mono(bx+124,y+15,r[1],on?GOLD:DIM,13);
    mono(bx+280,y+15,r[2],on?MUTE:DIM,11);
    ctx.globalAlpha=1;
  });
  // the data cost of each choice
  const cost=[6,64,180,240][cur];
  mono(bx,yc+180,'data this second ≈ '+cost+' units',MUTE,11);
  ctx.fillStyle='rgba(232,163,61,.5)';ctx.fillRect(bx+180,yc+170,cost*0.9,8);
  mono(bx,yc+206,'spend follows the world — not a clock. still rooms are almost free.',DIM,11);
}

// ══ 3 · COORDINATES + THE FRAMES THAT DIE ══════════════════════════════════
function actCoords(t){
  const x0=3450, yc=spineY(x0+600);
  mono(x0,yc-260,'EVERY READING IS STAMPED WHERE AND WHEN',FIRE,12);
  serif(x0,yc-222,'Nothing is remembered without its address.',TXT,26);
  kitchen(x0+40,yc+30,0.62,{dim:1});
  // boxes over the scene with live coordinates
  const boxes=[[100,-6,42,52,'jar','.31 .42'],[168,4,34,14,'label','.44 .48'],
               [-8,-42,44,44,'face','.09 .21'],[186,22,24,24,'mug','.52 .55']];
  boxes.forEach((b,i)=>{
    const on=(Math.sin(t*1.4+i*1.5)*0.5+0.5)>0.25;
    if(!on) return;
    const bx=x0+40+b[0]*0.62, by=yc+30+b[1]*0.62;
    box(bx,by,b[2]*0.62,b[3]*0.62,'rgba(92,200,255,.75)');
    mono(bx,by-6,b[4]+' '+b[5],EYE,9);
  });
  // frames streaming, blurry ones killed
  const fx=x0+560;
  mono(fx,yc-120,'frames arriving',DIM,11);
  for(let i=0;i<9;i++){
    const p=((t*0.35+i/9)%1), y=yc-96+p*250;
    const blurry=(i%3===1);
    ctx.globalAlpha=blurry?cl(1-(p-0.45)*4,0,1):1;
    if(blurry&&p>0.45){ctx.globalAlpha=cl(1-(p-0.45)*4,0,1);}
    ctx.strokeStyle=blurry?KILL:'rgba(92,200,255,.6)';ctx.lineWidth=1.2;
    ctx.strokeRect(fx,y,64,40);
    if(blurry){ctx.strokeStyle=KILL;ln(fx,y,fx+64,y+40,KILL,1);
      if(p>0.3)mono(fx+74,y+24,'blurred — dropped',KILL,10);}
    else if(p>0.3&&p<0.9) mono(fx+74,y+24,'sharp — read it',EYE,10);
    ctx.globalAlpha=1;
  }
  mono(x0,yc+250,'coordinates + timestamps are the primary key. meaning is attached later, and can always find its way home.',DIM,11);
}

// ══ 4 · GLANCE vs DWELL ════════════════════════════════════════════════════
function actDwell(t){
  const x0=5250, yc=spineY(x0+600);
  mono(x0,yc-268,'A GLANCE IS CHEAP. STAYING IS HOW IT LEARNS.',FIRE,12);
  serif(x0,yc-230,'The same jar, looked at for longer.',TXT,26);
  const cyc=(t*0.14)%1;
  // the jar alone, held in the gaze
  ctx.save();ctx.translate(x0+90,yc-40);ctx.scale(1.7,1.7);
  glow(30,30,70,'rgba(232,163,61,.18)',.9);
  ctx.fillStyle='#1d222c'; rr(0,0,58,66,6); ctx.fill();
  ctx.fillStyle='#2a2f3b'; rr(-2,-10,62,16,4); ctx.fill();
  ctx.fillStyle='rgba(150,96,48,.55)'; rr(4,32,50,32,3); ctx.fill();
  ctx.fillStyle='rgba(236,229,214,.85)'; rr(3,10,52,20,2); ctx.fill();
  ctx.fillStyle='#20242c';ctx.font='bold 9px Georgia';ctx.fillText('NUTELLA',7,23);
  ctx.restore();
  // gaze clock
  ctx.strokeStyle='#1d2532';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x0+140,yc+130,22,0,7);ctx.stroke();
  ctx.strokeStyle=FIRE;ctx.beginPath();
  ctx.arc(x0+140,yc+130,22,-1.57,-1.57+cyc*6.283);ctx.stroke();
  mono(x0+172,yc+135,(cyc*14).toFixed(1)+'s held',MUTE,11);
  const rungs=[
    ['0.2s','a jar','glance · 1 unit',0.05],
    ['1.4s','NUTELLA · 750 g','read the label · 4 units',0.26],
    ['5.0s','three-quarters empty · lid not fully turned','study it · 22 units',0.50],
    ['11.0s','German promo sleeve — this kitchen is probably in Germany','infer · 60 units',0.76]];
  const rx=x0+330;
  rungs.forEach((r,i)=>{
    const on=cyc>r[3], y=yc-150+i*74;
    ctx.globalAlpha=on?1:0.14;
    mono(rx,y,r[0],on?FIRE:DIM,11);
    serif(rx+66,y+3,r[1],on?TXT:DIM,17);
    mono(rx+66,y+22,r[2],on?DIM:DIM,10);
    if(on&&i>0)ln(rx+22,y-52,rx+22,y-10,'rgba(232,163,61,.35)',1.2);
    ctx.globalAlpha=1;
  });
  mono(rx,yc+186,'each level writes only what is NEW. the same fact is never stored twice.',DIM,11);
}

// ══ 5 · THE HELPERS ════════════════════════════════════════════════════════
function actHelpers(t){
  const x0=7100, yc=spineY(x0+600);
  mono(x0,yc-260,'DIFFERENT EYES FOR DIFFERENT THINGS — EACH BLIND TO THE OTHERS',FIRE,12);
  serif(x0,yc-222,'Three readings of one instant.',TXT,26);
  kitchen(x0-30,yc+40,0.42,{dim:1,speak:(t*0.5)%1});
  const hs=[
    ['reading eye','"NUTELLA 750 g"','x .44 y .48 · 09:14:07 · verbatim 1.00',EYE],
    ['object eye','glass jar, ¼ full, lid ajar','x .31 y .42 · 09:14:07 · gist 0.72',NODE],
    ['listening ear','"we\'re nearly out of the hazelnut stuff"','mic · 09:14:09 · verbatim 0.93',EAR]];
  hs.forEach((h,i)=>{
    const y=yc-160+i*112, on=(Math.sin(t*1.1+i*2.1)*0.5+0.5)>0.3;
    ctx.globalAlpha=on?1:0.4;
    ctx.strokeStyle=h[3];rr(x0+340,y,470,84,8);ctx.stroke();
    ctx.fillStyle='rgba(9,12,18,.7)';rr(x0+340,y,470,84,8);ctx.fill();
    mono(x0+356,y+22,h[0],h[3],11);
    serif(x0+356,y+48,h[1],TXT,16);
    mono(x0+356,y+70,h[2],DIM,10);
    ln(x0+250,yc+30,x0+340,y+42,on?'rgba(120,140,170,.4)':'#141b26',1);
    ctx.globalAlpha=1;
  });
  mono(x0+340,yc+260,'no helper is architecture — remove any one and the rest carry on',DIM,11);
}

// ══ 6 · THE BINDER ═════════════════════════════════════════════════════════
function actBinder(t){
  const x0=8950, yc=spineY(x0+560);
  mono(x0,yc-250,'SAME PLACE, SAME SECOND — THEREFORE ONE EVENT',FIRE,12);
  serif(x0,yc-212,'The binder makes three readings into one moment.',TXT,26);
  const cx=x0+560, cy=yc+20, p=(Math.sin(t*0.6)*0.5+0.5);
  const src=[[-360,-130,EYE,'"NUTELLA 750 g"'],[-380,0,NODE,'jar ¼ full, lid ajar'],
             [-360,130,EAR,'"nearly out of..."']];
  src.forEach(s=>{
    const x=cx+s[0]*(1-p*0.8), y=cy+s[1]*(1-p*0.8);
    dot(x,y,5,s[2],.9);
    ln(x,y,cx,cy,'rgba(95,112,140,'+(0.12+p*0.42)+')',1);
    if(p<0.55){ctx.globalAlpha=1-p*1.8;serif(x+14,y+5,s[3],s[2],14);ctx.globalAlpha=1;}
  });
  glow(cx,cy,78+p*46,'rgba(197,140,245,.4)',.45+p*0.4);
  dot(cx,cy,11+p*8,NODE,.95);
  if(p>0.55){serif(cx+40,cy-6,'09:14 · kitchen · the jar is nearly empty, and it was said aloud',TXT,17);
    mono(cx+40,cy+20,'still raw material — a first thought, not yet a node',DIM,11);}
}

// ══ 7 · NODES ══════════════════════════════════════════════════════════════
function actNodes(t){
  const x0=10700, yc=spineY(x0+560);
  mono(x0,yc-250,'THE MOMENT BECOMES THINGS THAT PERSIST',FIRE,12);
  serif(x0,yc-212,'Nodes: a jar, a person, a pantry — each with a history.',TXT,26);
  const ns=[['JAR · hazelnut spread',x0+150,yc-60,
             ['seen 7 times since 12 May','¼ full · 09:14 today','bought ~6 weeks ago']],
            ['YOU',x0+620,yc-140,['said it aloud · 09:14','buys it roughly monthly']],
            ['PANTRY · kitchen',x0+640,yc+90,['this shelf, 41 sightings']]];
  ns.forEach((n,i)=>{
    const f=(Math.sin(t*1.2+i*2)*0.5+0.5);
    glow(n[1]+90,n[2]+40,90,'rgba(197,140,245,.30)',.3+f*.3);
    ctx.strokeStyle='rgba(197,140,245,.55)';rr(n[1],n[2],290,44+n[3].length*22,9);ctx.stroke();
    ctx.fillStyle='rgba(9,12,18,.75)';rr(n[1],n[2],290,44+n[3].length*22,9);ctx.fill();
    mono(n[1]+16,n[2]+26,n[0],NODE,12);
    n[3].forEach((a,j)=>mono(n[1]+16,n[2]+50+j*22,'· '+a,MUTE,11));
  });
  ln(x0+440,yc-20,x0+620,yc-100,'rgba(197,140,245,.4)',1.4);
  ln(x0+440,yc+10,x0+640,yc+110,'rgba(197,140,245,.4)',1.4);
  mono(x0+150,yc+230,'every line above can name the second it came from, and the pixel it was read at',DIM,11);
}

// ══ 8 · THE FORMAT — OUR OWN EXTENSION ═════════════════════════════════════
function actFormat(t){
  const x0=12500, yc=spineY(x0+560);
  mono(x0,yc-262,'IT NEEDS ITS OWN FILE FORMAT — THE WAY IMAGES NEEDED .PNG',FIRE,12);
  serif(x0,yc-224,'A life does not fit in a database row.',TXT,26);
  mono(x0,yc-192,'a specified container anyone can implement, and only you can open',DIM,12);
  const chunks=[
    ['HEADER','version · device · counts — readable without the key',GOLD,64],
    ['RAW LOG','append-only. every reading, immutable, forever',EYE,150],
    ['GRAPH','nodes, edges, confidence — rebuildable from RAW',NODE,120],
    ['PROVENANCE','which pixel, which second, which helper, how sure',EAR,110],
    ['META','derived thoughts — deletable, re-derivable',WARM,80]];
  let y=yc-140;
  chunks.forEach((c,i)=>{
    const on=(t*0.5+i*0.2)%2.2<1.6;
    ctx.globalAlpha=on?1:.55;
    ctx.strokeStyle=c[2];rr(x0+140,y,c[3]*2.6,42,5);ctx.stroke();
    ctx.fillStyle='rgba(9,12,18,.6)';rr(x0+140,y,c[3]*2.6,42,5);ctx.fill();
    mono(x0+156,y+26,c[0],c[2],12);
    mono(x0+160+c[3]*2.6,y+26,c[1],MUTE,11);
    ctx.globalAlpha=1; y+=54;
  });
  mono(x0+140,y+16,'.trace  —  encrypted at rest · portable · yours to take anywhere',GOLD,12);
  mono(x0+140,y+40,'lose the meta and nothing is lost. lose the raw and everything is.',DIM,11);
}

// ══ 9 · MARINATION ═════════════════════════════════════════════════════════
const cells=[];(function(){for(let i=0;i<12;i++)cells.push({a:R(0,7),r:R(80,225),p:R(0,7)});})();
function actNight(t){
  const x0=14150, yc=spineY(x0+560);
  mono(x0,yc-262,'AT NIGHT IT THINKS ABOUT WHAT IT SAW',FIRE,12);
  serif(x0,yc-224,'Nodes fire together. Some pairs make a third thing.',TXT,26);
  const cx=x0+560,cy=yc+30;
  const pts=cells.map(c=>{const a=c.a+t*0.05;
    return{x:cx+Math.cos(a)*c.r,y:cy+Math.sin(a)*c.r*0.6,f:(Math.sin(t*1.3+c.p)*0.5+0.5)};});
  pts.forEach((p,i)=>pts.forEach((q,j)=>{if(j<=i)return;
    const d=Math.hypot(p.x-q.x,p.y-q.y);
    if(d<180){const f=Math.min(p.f,q.f);
      ctx.strokeStyle='rgba(197,140,245,'+(0.04+f*0.32)+')';ctx.lineWidth=0.6+f*1.4;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();}}));
  pts.forEach(p=>{dot(p.x,p.y,3.4+p.f*3,NODE,.5+p.f*.5);
    if(p.f>0.82)glow(p.x,p.y,28,'rgba(197,140,245,.55)',.45);});
  const dc=(t*0.2)%1;
  if(dc>0.3){const a=pts[3],b=pts[8],mx=(a.x+b.x)/2,my=(a.y+b.y)/2-64,g=cl((dc-0.3)/0.3,0,1);
    ln(a.x,a.y,mx,my,'rgba(255,208,138,'+0.7*g+')',1.6);
    ln(b.x,b.y,mx,my,'rgba(255,208,138,'+0.7*g+')',1.6);
    glow(mx,my,46*g,'rgba(255,208,138,.55)',.7*g);dot(mx,my,5*g,GOLD,g);
    if(g>0.55)serif(mx+18,my-4,'“you run out roughly every six weeks”',GOLD,16);
    if(g>0.75)mono(mx+18,my+18,'nobody recorded this. it was derived, and it cites its evidence.',DIM,10);}
  const pr=(t*0.17+0.4)%1;
  ctx.globalAlpha=cl(1-pr*1.7,0,1);
  ctx.strokeStyle=KILL;rr(x0+170,yc+250,220,30,5);ctx.stroke();
  mono(x0+182,yc+270,'a guess that paid no rent',KILL,10);
  ctx.globalAlpha=1;
  mono(x0+170,yc+306,'the failed thought is deleted. the raw underneath is never touched —',DIM,11);
  mono(x0+170,yc+326,'so a better idea tomorrow can be tried on the same evidence.',DIM,11);
}

// ══ 10 · THE QUESTION, THE ANSWER, THE WAY HOME ════════════════════════════
function actAsk(t){
  const x0=15650, yc=spineY(x0+400);
  mono(x0,yc-250,'MONTHS LATER',FIRE,12);
  const p=(t*0.22)%1;
  ctx.strokeStyle=FIRE;rr(x0,yc-200,392,44,22);ctx.stroke();
  serif(x0+20,yc-171,'“do we need more of that spread?”',GOLD,17);
  const picks=['jar ¼ full · 09:14, 12 Jun','"nearly out" · heard, 12 Jun','runs out every ~6 weeks'];
  picks.forEach((s,i)=>{
    const lp=cl((p-i*0.1)*3,0,1);
    if(lp<=0)return;
    ctx.globalAlpha=lp;
    ctx.strokeStyle='#1d2634';rr(x0+40,yc-110+i*38,330,30,5);ctx.stroke();
    mono(x0+54,yc-90+i*38,s,MUTE,11);
    ctx.globalAlpha=1;
  });
  mono(x0+40,yc+30,'three memories — not three thousand',DIM,11);
  if(p>0.45){
    ctx.globalAlpha=cl((p-0.45)*4,0,1);
    serif(x0,yc+96,'Almost certainly. It was a quarter full on',TXT,21);
    serif(x0,yc+126,'12 June, you said so out loud, and it has',TXT,21);
    serif(x0,yc+156,'been about six weeks.',TXT,21);
    ctx.globalAlpha=1;
  }
  // the citation walks all the way back to the jar in the first scene
  if(p>0.7){
    const w=cl((p-0.7)/0.3,0,1), hx=x0-w*15400;
    ln(x0,yc+190,hx,yc+190,'rgba(232,163,61,.28)',1,[2,9]);
    dot(hx,yc+190,3.5,FIRE,.9);
    mono(x0,yc+218,'every sentence can walk back to the pixel that made it',FIRE,11);
  }
}

function drawSpine(){
  ctx.strokeStyle='#0e131c';ctx.lineWidth=1.4;ctx.beginPath();
  for(let x=cam-200;x<cam+W+200;x+=16){const y=spineY(x);
    x===cam-200?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();
}
const motes=[];
for(let i=0;i<200;i++)motes.push({x:R(0,WORLD),o:R(-60,60),l:Math.random()<.7?'v':'a',s:R(24,44)});
function drawMotes(dt){
  motes.forEach(m=>{
    m.x+=m.s*dt; if(m.x>WORLD)m.x-=WORLD;
    if(m.x<cam-100||m.x>cam+W+100)return;
    const y=spineY(m.x)+m.o;
    const c = m.x>10500?NODE : (m.x>8800?TXT : (m.l==='v'?EYE:EAR));
    dot(m.x,y,1.9,c,.3);
  });
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  const t=now/1000;
  // A page can load into a container with no size yet (hidden tab, embed).
  // Re-adopt the real viewport whenever it disagrees, not just on resize.
  if(W!==innerWidth||H!==innerHeight){
    if(innerWidth&&innerHeight) resize();
    else { requestAnimationFrame(frame); return; }   // keep the loop alive
  }
  camTarget=prog()*(WORLD-W*0.6);
  cam+=(camTarget-cam)*Math.min(1,dt*4.5);
  head.style.height=(prog()*100)+'%';
  hint.style.opacity=prog()>0.01?0:1;
  ctx.fillStyle=INK;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(-cam,0);
  drawSpine(); drawMotes(dt);
  const acts=[[0,2200,actMoment],[900,4200,actSampling],[2600,5900,actCoords],
    [4400,7600,actDwell],[6200,9400,actHelpers],[8100,11000,actBinder],
    [9800,12800,actNodes],[11600,14600,actFormat],[13200,16200,actNight],
    [14800,16200,actAsk]];
  let ran=[];
  acts.forEach(a=>{if(cam+W>a[0]&&cam<a[1]){ran.push(a[2].name);
    try{a[2](t);}catch(e){window.__err=a[2].name+': '+e.message;}}});
  window.__dbg={cam:Math.round(cam),ran:ran.join(','),prog:prog().toFixed(3)};
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__frame=frame;
let lastPaint=0;
setInterval(()=>{if(performance.now()-lastPaint>300)frame(performance.now());},250);
const _f=frame; frame=function(n){lastPaint=n;_f(n);};
})();
</script>
