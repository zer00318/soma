<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACE — one moment, through the whole machine</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#06080c;height:100%}
  body{height:1700vh}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    font:11px ui-monospace,Menlo,monospace;letter-spacing:.34em;color:#5b6478;z-index:5;transition:opacity .6s}
  #rail{position:fixed;right:0;top:0;bottom:0;width:2px;background:#0f131b;z-index:5}
  #head{position:absolute;left:0;width:2px;background:#e8a33d}
  #map{position:fixed;left:0;right:0;top:0;height:34px;z-index:6;
    display:flex;align-items:center;padding:0 12px;overflow-x:auto;scrollbar-width:none;
    background:linear-gradient(#06080c,rgba(6,8,12,0));font:9px ui-monospace,Menlo,monospace;
    letter-spacing:.16em;color:#39414f;user-select:none;white-space:nowrap}
  #map::-webkit-scrollbar{display:none}
  #map b{font-weight:400;cursor:pointer;padding:4px 6px;transition:color .3s}
  #map b.on{color:#e8a33d}
  #map i{font-style:normal;color:#1b2230}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="map"></div>
<div id="hint">SCROLL</div>
<div id="rail"><div id="head"></div></div>
<script>
(function(){
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hint=document.getElementById('hint'), head=document.getElementById('head'), map=document.getElementById('map');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* ── palette ── */
const DIM='#39414f',MUTE='#7b8799',TXT='#dfe6f2',
      FIRE='#e8a33d',GOLD='#ffd08a',EYE='#5cc8ff',EAR='#7ed9a0',
      KILL='#f2685f',NODE='#c58cf5',BIND='#6fa8ff';
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ── primitives ── */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function mono(x,y,s,c,sz,al){ctx.fillStyle=c||MUTE;ctx.font=(sz||11)+'px ui-monospace,Menlo,monospace';
  ctx.textAlign=al||'left';ctx.fillText(s,x,y);ctx.textAlign='left';}
function serif(x,y,s,c,sz,al){ctx.fillStyle=c||TXT;
  ctx.font=(sz||22)+'px "Iowan Old Style",Palatino,Georgia,serif';ctx.textAlign=al||'left';
  ctx.fillText(s,x,y);ctx.textAlign='left';}
function ln(x1,y1,x2,y2,c,w,d){ctx.strokeStyle=c;ctx.lineWidth=w||1;if(d)ctx.setLineDash(d);
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);}
function dot(x,y,r,c,a){ctx.globalAlpha=a===undefined?1:a;ctx.fillStyle=c;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=a===undefined?.5:a;
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.globalAlpha=1;}
function arrow(x1,y1,x2,y2,c,a){ctx.globalAlpha=a===undefined?1:a;ln(x1,y1,x2,y2,c,1.3);
  const an=Math.atan2(y2-y1,x2-x1);ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x2,y2);
  ctx.lineTo(x2-8*Math.cos(an-.36),y2-8*Math.sin(an-.36));
  ctx.lineTo(x2-8*Math.cos(an+.36),y2-8*Math.sin(an+.36));ctx.closePath();ctx.fill();ctx.globalAlpha=1;}
function flow(x1,y1,x2,y2,c,n,speed,phase,r){for(let i=0;i<n;i++){
  const p=((T*speed+phase+i/n)%1);
  dot(x1+(x2-x1)*p,y1+(y2-y1)*p,r||2.2,c,.25+.75*Math.sin(p*Math.PI));}}
function rectProg(x,y,w,h,per,c,lw){per=cl(per,0,1);if(per<=0)return;
  const P=2*(w+h);let rem=per*P,px=x,py=y;
  ctx.strokeStyle=c;ctx.lineWidth=lw||1.4;ctx.beginPath();ctx.moveTo(x,y);
  const seg=[[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
  for(let k=0;k<4;k++){const sx=seg[k][0],sy=seg[k][1],d=Math.hypot(sx-px,sy-py);
    if(rem<=0)break;const q=Math.min(1,rem/d);
    ctx.lineTo(px+(sx-px)*q,py+(sy-py)*q);rem-=d;px=sx;py=sy;}
  ctx.stroke();}
function typeText(x,y,str,k,c,sz){const s=str.slice(0,Math.floor(cl(k,0,1)*str.length));
  serif(x,y,s,c,sz);
  if(k>0&&k<1&&Math.sin(T*8)>0){ctx.font=sz+'px "Iowan Old Style",Palatino,Georgia,serif';
    const w2=ctx.measureText(s).width;ctx.fillStyle=FIRE;ctx.fillRect(x+w2+3,y-sz*.8,Math.max(6,sz*.38),sz*.9);}}
function header(x0,yc,k,h,s){mono(x0,yc-250,k,FIRE,12);serif(x0,yc-208,h,TXT,27);
  if(s)mono(x0,yc-176,s,DIM,11.5);}
function wave(x,y,w,amp,seed,color,lw){ctx.strokeStyle=color;ctx.lineWidth=lw||1.4;ctx.beginPath();
  for(let i=0;i<=160;i++){const px=x+(i/160)*w;
    const a=amp*Math.sin(i*.33+T*3+seed)*Math.sin(i*.061+T*1.2+seed*2);
    i?ctx.lineTo(px,y+a):ctx.moveTo(px,y+a);}ctx.stroke();}

/* ── THE SCENE — one kitchen, drawn again and again. everything refers back to it. ── */
function jarDraw(x,y){
  ctx.fillStyle='#2a2f3b';rr(x,y,62,16,4);ctx.fill();               /* lid */
  ctx.fillStyle='#1d222c';rr(x+2,y+10,58,66,6);ctx.fill();          /* glass */
  ctx.fillStyle='rgba(150,96,48,.55)';rr(x+6,y+44,50,28,3);ctx.fill(); /* contents · quarter */
  ctx.fillStyle='rgba(236,229,214,.85)';rr(x+5,y+20,52,20,2);ctx.fill(); /* label */
  ctx.fillStyle='#20242c';ctx.font='bold 8px Georgia';ctx.fillText('NUSSGOLD',x+8,y+33);
  ctx.font='6px Georgia';ctx.fillStyle='#4a4f58';ctx.fillText('750 g',x+21,y+38);
}
function scene(ox,oy,s,o){o=o||{};
  ctx.save();ctx.translate(ox,oy);ctx.scale(s,s);
  if(o.alpha!==undefined)ctx.globalAlpha=o.alpha;
  const g=ctx.createLinearGradient(150,-160,420,140);
  g.addColorStop(0,'rgba(255,214,150,'+(o.dim?.05:.10)+')');g.addColorStop(1,'rgba(255,214,150,0)');
  ctx.fillStyle=g;ctx.fillRect(120,-170,340,330);
  ctx.strokeStyle='#1b2330';ctx.lineWidth=2;ctx.strokeRect(150,-160,150,120);
  ctx.beginPath();ctx.moveTo(225,-160);ctx.lineTo(225,-40);ctx.moveTo(150,-100);ctx.lineTo(300,-100);ctx.stroke();
  ctx.fillStyle='#0e131d';ctx.fillRect(455,-120,70,194);            /* fridge */
  ctx.strokeStyle='#161d2a';ctx.strokeRect(455,-120,70,194);
  ctx.fillStyle='#141a25';ctx.fillRect(-60,60,540,14);              /* counter */
  ctx.fillStyle='#0d121b';ctx.fillRect(-60,74,540,90);
  ctx.fillStyle=o.dim?'#10151f':'#161d2a';                          /* person */
  ctx.beginPath();ctx.arc(30,-30,30,0,7);ctx.fill();
  rr(-10,10,80,58,16);ctx.fill();
  ctx.strokeStyle=o.dim?'#10151f':'#161d2a';ctx.lineWidth=17;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(66,26);ctx.lineTo(146,40);ctx.stroke();ctx.lineCap='butt';
  jarDraw(158,-16);
  ctx.fillStyle='#131924';rr(298,24,36,36,5);ctx.fill();            /* mug */
  ctx.fillStyle='#151b26';rr(360,44,86,16,3);ctx.fill();            /* board */
  if(o.speak!==undefined){for(let i=0;i<3;i++){const q=((o.speak+i/3)%1);
    ctx.strokeStyle='rgba(126,217,160,'+(0.35*(1-q))+')';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(6,-30,16+q*70,2.2,4.1);ctx.stroke();}}
  ctx.restore();}
/* region boxes in scene space: [x,y,w,h] */
const RG={jar:[152,-20,74,96],label:[160,2,58,24],person:[-14,-64,96,140],mug:[294,20,44,44]};
function sceneBox(ox,oy,s,b){return [ox+b[0]*s,oy+b[1]*s,b[2]*s,b[3]*s];}

/* the blurry / sharp evidence frames */
function frameJar(x,y,w,h,blur){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  ctx.fillStyle='#0a0e16';ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#141a25';ctx.fillRect(x,y+h-30,w,10);
  const draws=blur?[[-9,.28],[0,.4],[9,.28]]:[[0,1]];
  for(let k=0;k<draws.length;k++){const off=draws[k][0];ctx.globalAlpha=draws[k][1];
    ctx.strokeStyle='#161d2a';ctx.lineWidth=13;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x+16+off,y+h-52);ctx.lineTo(x+w*.42+off,y+h-46);ctx.stroke();ctx.lineCap='butt';
    ctx.save();ctx.translate(x+w*.5+off,y+h-116);jarDraw(0,0);ctx.restore();}
  ctx.globalAlpha=1;
  if(blur){ctx.strokeStyle='rgba(223,230,242,.09)';ctx.lineWidth=2;
    for(let i=0;i<5;i++){const yy=y+16+i*(h-30)/4;
      ctx.beginPath();ctx.moveTo(x+6,yy);ctx.lineTo(x+w-6,yy+6);ctx.stroke();}}
  ctx.restore();
  ctx.strokeStyle=blur?KILL:EYE;ctx.lineWidth=1.6;ctx.strokeRect(x,y,w,h);}

/* ── acts ── */
const ACTS=[
  {k:'SCENE'},{k:'SPLIT'},{k:'VIDEO'},{k:'BLUR'},{k:'AUDIO'},{k:'COORDS'},
  {k:'MACRO'},{k:'TEXT'},{k:'BIND'},{k:'NODES'},{k:'NIGHT'},{k:'ASK'},{k:'MACHINE'}];
const SPAN=1700, WORLD=SPAN*(ACTS.length-1);
let cam=0,camT=0,T=0,navAct=0,locked=false;
const scrollMax=()=>document.body.scrollHeight-innerHeight;
const prog=()=>{const m=scrollMax();return m>0?cl(scrollY/m,0,1):0;};
function readHash(){const h=(location.hash||'').replace(/^#(act=)?/,'');if(h==='')return false;
  const i=parseInt(h,10);if(isNaN(i))return false;
  navAct=cl(i,0,ACTS.length-1);locked=true;return true;}
addEventListener('hashchange',function(){if(readHash())cam=navAct*SPAN;});
function goto(i){navAct=cl(i,0,ACTS.length-1);const m=scrollMax();
  if(m>0)scrollTo({top:m*(navAct/(ACTS.length-1)),behavior:'smooth'});}
ACTS.forEach(function(a,i){const b=document.createElement('b');b.textContent=a.k;
  b.onclick=function(){goto(i);};map.appendChild(b);
  if(i<ACTS.length-1){const s=document.createElement('i');s.textContent='·';map.appendChild(s);}});
const tabs=[].slice.call(map.querySelectorAll('b'));
addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();goto(navAct+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();goto(navAct-1);}
  if(e.key==='Home'){e.preventDefault();goto(0);}
  if(e.key==='End'){e.preventDefault();goto(ACTS.length-1);}});
addEventListener('scroll',function(){locked=false;
  if(scrollMax()>0)navAct=Math.round(prog()*(ACTS.length-1));});
if(readHash())cam=navAct*SPAN;

/* scatter for the frame-death beat — computed once */
const SCAT=[];for(let i=0;i<70;i++)SCAT.push({x:Math.random(),y:Math.random(),
  a:Math.random()*6.28,v:40+Math.random()*110});

/* ══ 0 · THE MOMENT ══ */
function actScene(x0,yc,lp){
  header(x0,yc,'09:14:07 · TUESDAY · KITCHEN',
    'A person reaches for a jar and says something.',
    'this is the only moment that will ever happen. everything after is about keeping it.');
  scene(x0+160,yc+40,1,{speak:(T*.5)%1});
  const a=cl(((T*.5)%1)*3,0,1);
  if(a>.15){ctx.globalAlpha=cl(a*2,0,1);
    serif(x0+740,yc-30,'“we’re nearly out of',EAR,20);
    serif(x0+740,yc,'the hazelnut stuff”',EAR,20);ctx.globalAlpha=1;}
  mono(x0+740,yc+42,'sound, arriving as sound — not yet as words',DIM,11);
  if(lp>.5){ctx.globalAlpha=cl((lp-.5)*4,0,1);
    mono(x0,yc+238,'nothing has been stored. nothing ever will be — not as pixels, anyway.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 1 · THE SPLIT ══ */
function actSplit(x0,yc,lp){
  header(x0,yc,'THE STREAM SPLITS',
    'One moment becomes two signals.',
    'the same second, carried by light and by air');
  scene(x0+80,yc+40,.58,{dim:1,speak:(T*.5)%1});
  const lx=x0+420;
  ctx.globalAlpha=cl(lp*3,0,1);
  ln(x0+300,yc-16,lx-16,yc-70,'rgba(92,200,255,.3)',1.2);
  ln(x0+300,yc+52,lx-16,yc+96,'rgba(126,217,160,.3)',1.2);
  flow(x0+300,yc-16,lx-16,yc-70,EYE,2,.3,0,2);
  flow(x0+300,yc+52,lx-16,yc+96,EAR,2,.3,.5,2);
  mono(lx,yc-104,'VIDEO · EYES',EYE,10.5);
  for(let i=0;i<8;i++){const p=(T*.12+i/8)%1;const fx=lx+p*430;
    ctx.globalAlpha=(.2+.8*Math.sin(p*Math.PI))*cl(lp*3,0,1);
    ctx.strokeStyle=EYE;ctx.lineWidth=1.2;ctx.strokeRect(fx,yc-88,34,24);
    ctx.fillStyle='rgba(92,200,255,.06)';ctx.fillRect(fx,yc-88,34,24);}
  ctx.globalAlpha=cl(lp*3,0,1);
  mono(lx+470,yc-72,'frames',DIM,10);
  mono(lx,yc+66,'AUDIO · EARS',EAR,10.5);
  wave(lx,yc+96,430,15,0,EAR,1.4);
  mono(lx+470,yc+100,'pressure',DIM,10);
  ctx.globalAlpha=1;
  if(lp>.55){ctx.globalAlpha=cl((lp-.55)*4,0,1);
    mono(x0,yc+238,'we can’t manufacture other senses — and almost everything arrives through these two.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 2 · VIDEO — the dial ══ */
function actVideo(x0,yc,lp){
  header(x0,yc,'THE VIDEO · HOW HARD TO LOOK',
    'How much to spend on this instant?',
    'the dial moves by itself, many times a second — resolution and framerate follow the world');
  const rows=[
    ['360p · 5 fps','a still room — barely look',10,7,52,7],
    ['1080p · 30 fps','someone is here — watch properly',17,11,30,9],
    ['720p · 120 fps','the reach is fast — freeze it',11,8,16,15],
    ['4K · one frame','it settled — one deep look, once',66,44,0,1]];
  const ph=(T*.14)%1;let cur=0;
  for(let i=0;i<4;i++)if(ph>=i*.25)cur=i;
  const bx=x0+40;
  for(let i=0;i<4;i++){const y=yc-120+i*72,on=i===cur,r=rows[i];
    ctx.globalAlpha=on?1:.3;
    mono(bx,y-6,r[0],on?FIRE:MUTE,11);
    mono(bx+150,y-6,r[1],on?GOLD:DIM,10);
    for(let f=0;f<r[5];f++){const fx=bx+f*(r[2]+r[4]);
      ctx.strokeStyle=on?EYE:DIM;ctx.lineWidth=1.1;
      ctx.strokeRect(fx,y+8,r[2],r[3]);
      if(on){ctx.fillStyle='rgba(92,200,255,.08)';ctx.fillRect(fx,y+8,r[2],r[3]);}}
    if(on){const cost=[6,64,150,240][i];
      ctx.fillStyle='rgba(232,163,61,.5)';ctx.fillRect(bx+560,y+10,cost*.7,8);
      mono(bx+560,y-2,'cost '+cost,FIRE,9.5);}
    ctx.globalAlpha=1;}
  if(lp>.6){ctx.globalAlpha=cl((lp-.6)*4,0,1);
    mono(x0+40,yc+218,'spend follows the world — not a clock. a still room is almost free; the reach costs everything, once.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 3 · BLUR — shown, then discarded ══ */
function actBlur(x0,yc,lp){
  header(x0,yc,'THE BLUR GATE',
    'This frame is unreadable. Look at it.',
    'the gate sees every frame before anything else does');
  frameJar(x0+60,yc-90,230,170,false);
  mono(x0+60,yc+104,'✓ kept — the label is legible',EAR,11);
  mono(x0+60,yc+122,'sharpness .94',DIM,10);
  const f=cl((lp-.42)*1.7,0,1);
  ctx.save();
  ctx.translate(x0+495+ (f*30),yc-5+f*170);ctx.rotate(f*.4);
  ctx.globalAlpha=1-f*.85;
  frameJar(-115,-85,230,170,true);
  ctx.restore();ctx.globalAlpha=1;
  if(f<.4){mono(x0+380,yc+104,'✕ blur .71 — discarded',KILL,11);
    mono(x0+380,yc+122,'the hand moved; the label smeared',DIM,10);}
  else{ctx.globalAlpha=cl((f-.4)*3,0,1);
    mono(x0+380,yc+104,'gone. it never touched disk.',KILL,11.5);ctx.globalAlpha=1;}
  if(lp>.72){ctx.globalAlpha=cl((lp-.72)*4,0,1);
    mono(x0+60,yc+218,'a frame that cannot be read is never written. there is nothing to store, nothing to leak, nothing to subpoena.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 4 · AUDIO — the room, transcribed ══ */
function actAudio(x0,yc,lp){
  header(x0,yc,'THE AUDIO · TRANSCRIBED',
    'Not just the voice. The room.',
    'every sound becomes a line of text, stamped when it happened');
  wave(x0+40,yc-110,760,22,0,EAR,1.6);
  wave(x0+40,yc-110,760,7,3.1,'rgba(123,135,153,.35)',1);
  mono(x0+40,yc-146,'voice',EAR,9.5);
  mono(x0+150,yc-146,'· background',MUTE,9.5);
  const L=[
    ['“we’re nearly out of the hazelnut stuff”','voice · 09:14:09 · verbatim .93',EAR],
    ['[fridge hum · constant, low]','background · the whole minute',MUTE],
    ['[kettle click]','background · 09:14:05',MUTE],
    ['[footsteps, leaving]','background · 09:14:12',MUTE]];
  for(let i=0;i<4;i++){const k=cl((lp-.12-.14*i)*5,0,1);if(k<=0)continue;
    ctx.globalAlpha=k;const y=yc-40+i*52;
    ln(x0+40,y+16,x0+800,y+16,'rgba(123,135,153,.1)',1);
    mono(x0+40,y,L[i][0],L[i][2],i===0?14:12.5);
    mono(x0+800,y,L[i][1],DIM,9.5,'right');
    ctx.globalAlpha=1;}
  if(lp>.72){ctx.globalAlpha=cl((lp-.72)*4,0,1);
    mono(x0+40,yc+206,'the machine heard the kettle. one day you’ll ask “did I put the kettle on?” — and it will know.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 5 · COORDINATES — physically drawn ══ */
function actCoords(x0,yc,lp){
  header(x0,yc,'COORDINATES + TIMESTAMPS',
    'Nothing is remembered without its address.',
    'x · y · second — the primary key of the whole machine');
  const fx=x0+40,fy=yc-130,FW=520,FH=300,s=.8,ox=fx+56,oy=fy+146;
  ctx.strokeStyle='rgba(123,135,153,.3)';ctx.lineWidth=1.4;ctx.strokeRect(fx,fy,FW,FH);
  for(let i=1;i<10;i++)ln(fx+i*FW/10,fy,fx+i*FW/10,fy+FH,'rgba(123,135,153,.06)',1);
  for(let i=1;i<6;i++)ln(fx,fy+i*FH/6,fx+FW,fy+i*FH/6,'rgba(123,135,153,.06)',1);
  scene(ox,oy,s,{dim:1});
  mono(fx,fy-10,'the kept frame · 09:14:07',DIM,9.5);
  const BXS=[
    [RG.jar,'jar','x .31  y .42'],
    [RG.label,'label','x .44  y .48'],
    [RG.person,'person','x .09  y .21'],
    [RG.mug,'mug','x .52  y .55']];
  for(let i=0;i<4;i++){const per=cl((lp-.1-.16*i)*4,0,1);if(per<=0)continue;
    const b=sceneBox(ox,oy,s,BXS[i][0]);
    rectProg(b[0],b[1],b[2],b[3],per,EYE,1.4);
    if(per>=1){dot(b[0]+b[2]/2,b[1]+b[3]/2,2,EYE,.8);
      const cy2=fy+24+i*66;
      ln(b[0]+b[2],b[1]+6,fx+FW+22,cy2,'rgba(92,200,255,.22)',1);
      mono(fx+FW+30,cy2,BXS[i][1],TXT,12);
      mono(fx+FW+30,cy2+16,BXS[i][2],EYE,10.5);
      mono(fx+FW+30,cy2+31,'09:14:07',DIM,9.5);}}
  if(lp>.75){ctx.globalAlpha=cl((lp-.75)*4,0,1);
    mono(fx,fy+FH+34,'the address comes first. meaning is attached later — and can always find its way home.',MUTE,12);
    ctx.globalAlpha=1;}
}

/* ══ 6 · MACRO — context, then the specialists ══ */
function actMacro(x0,yc,lp){
  header(x0,yc,'THE MACRO EYE ⇒ THE HELPERS',
    'First see the whole. Then summon the right eyes.',

const RENDER=[actScene,actSplit,actVideo,actBlur,actAudio,actCoords,actMacro,
              actText,actBind,actNodes,actNight,actAsk,actMachine];

/* ── loop ── */
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  camT=(locked||scrollMax()<=0)?navAct*SPAN:prog()*WORLD;
  cam+=(camT-cam)*Math.min(dt*4.5,1);
  ctx.fillStyle='#06080c';ctx.fillRect(0,0,W,H);
  ln(0,H*.5,W,H*.5,'rgba(123,135,153,.05)',1);
  const yc=H*.52;
  const active=Math.round(cam/SPAN);
  for(let i=Math.max(0,active-1);i<=Math.min(ACTS.length-1,active+1);i++){
    const ax=i*SPAN-cam+110;
    if(ax>W+500||ax<-1600)continue;
    /* build while entering from the right; complete BEFORE center; dwell built */
    const lp=cl((cam-(i*SPAN-SPAN*.56))/(SPAN*.48),0,1);
    ctx.save();
    const d=Math.abs(i*SPAN-cam)/SPAN;
    ctx.globalAlpha=cl(1-(Math.max(0,d-.15))*1.4,0,1);
    RENDER[i](ax,yc,lp);
    ctx.restore();}
  const pct=scrollMax()>0?prog():navAct/(ACTS.length-1);
  head.style.height=(pct*100)+'%';
  hint.style.opacity=pct>.02?0:1;
  tabs.forEach(function(b,i){b.classList.toggle('on',i===active);});
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
