[project]
name = "trace-memory"
version = "0.1.0"
description = "Private, text-only memory for unconstrained grounded recall."
requires-python = ">=3.9"
dependencies = ["cryptography>=48.0.0"]

[project.optional-dependencies]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "vulture>=2.14,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["trace_memory.domain", "trace_memory.application"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
python_version = "3.9"
strict = true
mypy_path = "src"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "BLE", "C4", "C90", "E", "F", "I", "N", "PERF", "RUF", "UP", "W"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
